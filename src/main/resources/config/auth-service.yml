# Configuracion de auth-service-stockmype (usuarios y login)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/stockmype_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
